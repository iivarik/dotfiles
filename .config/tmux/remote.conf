# Sourced by tmux.conf when running over ssh (catppuccin mocha colors, bottom bar)
set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g pane-active-border-style "fg=#a6e3a1"

set -g window-status-format "#[fg=#7f849c] #I #W "
set -g window-status-current-format "#[bg=#a6e3a1,fg=#11111b,bold] #I #W "

set -g status-right "\
#[bg=#313244,fg=#cdd6f4]  #{pane_current_path} \
#[bg=#fab387,fg=#11111b]  #{client_user} \
#[bg=#cba6f7,fg=#11111b] 󰒋 #H \
#[bg=#a6e3a1,fg=#11111b]  #S "

# ---------------------------------------------------------------------------
# General (no plugins: nothing to update, nothing to break)
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g display-time 3000
set -g renumber-windows on
set -g set-clipboard on

set -g status-keys vi
set -g mode-keys vi

# ---------------------------------------------------------------------------
# Keys
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-s
bind C-s send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

bind space next-window
bind bspace previous-window
bind enter next-layout

# Copy mode: v to select, y to copy (to the Windows clipboard via OSC 52)
bind [ copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Ctrl+h/j/k/l moves between panes, passing keys through to (n)vim
# (pairs with nvim-tmux-navigation in nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind -n C-Space if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l
bind -T copy-mode-vi C-Space select-pane -t:.+

# F12 turns all local keys off so they pass to a nested (remote) tmux.
# Idea from https://github.com/samoshkin/tmux-config
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S
bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    refresh-client -S

# ---------------------------------------------------------------------------
# Status line (catppuccin macchiato colors)
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-interval 1
set -g status-style "bg=#1e2030,fg=#cad3f5"
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g mode-style "bg=#494d64"
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"

set -g status-left ""
set -g window-status-separator ""
set -g window-status-format "#[fg=#8087a2] #W #I "
set -g window-status-current-format "#[bg=#8aadf4,fg=#181926,bold] #W #I "

set -g status-right-length 120
set -g status-right "\
#{?#{==:#{client_key_table},off},#[bg=#ed8796]#[fg=#181926] 󰌐 OFF ,#[bg=#f5a97f]#[fg=#181926] 󰌌 ON }\
#[bg=#363a4f,fg=#cad3f5]  #{pane_current_command} \
#[bg=#c6a0f6,fg=#181926]  #S \
#[bg=#363a4f,fg=#cad3f5]  #{client_user} \
#[bg=#8aadf4,fg=#181926] 󰃰 %Y-%m-%d %H:%M:%S "

# Remote (ssh) sessions get a different look so nested tmux is easy to tell apart
if 'test -n "$SSH_CLIENT"' 'source-file ~/.config/tmux/remote.conf'
